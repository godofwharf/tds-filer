[project]
name = "tds-filer"
version = "0.1.0"
description = "Prepare, validate and package quarterly Form 144 (ex-27Q) TDS statements"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tds = "tds_filer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tds_filer"]
